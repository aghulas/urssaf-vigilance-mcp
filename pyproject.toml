[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urssaf-vigilance-mcp"
version = "0.1.0"
description = "Serveur MCP : vérification des attestations de vigilance Urssaf (API Attestations Vérification Code Sécurité) et suivi des fournisseurs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
urssaf-vigilance-mcp = "urssaf_vigilance_mcp.server:main"

[tool.setuptools.packages.find]
include = ["urssaf_vigilance_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
